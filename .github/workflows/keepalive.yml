# 여러 Streamlit Community Cloud 앱을 한 번에 깨워 두는 워크플로
# 위치: 저장소의 .github/workflows/keepalive.yml
# 앱 추가/삭제: 아래 APPS 목록에 주소만 한 줄씩 넣거나 빼면 됨 (# 으로 시작하는 줄은 무시)
name: Streamlit keep-alive

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (UTC 기준 → 한국 02:17, 08:17, 14:17, 20:17)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write             # 아래 '저장소 활동 유지' 커밋용

env:
  CONCURRENCY: "6"            # 동시에 여는 앱 수
  APPS: |
    https://advanced-daily-supply-forecast.streamlit.app/
    https://contract-dashboard.streamlit.app/
    https://daesung-energy-msg-automation.streamlit.app/
    https://deungibu-app.streamlit.app/
    https://final-apt-map.streamlit.app/
    https://forecastapp-adqsr9ymhz6sveuwhvytux.streamlit.app/
    https://fuelcell-gas-calculator.streamlit.app/
    https://daesung-industrial-cogeneration-gas-price-report.streamlit.app/
    https://industrial-customer-dashboard-all-in-one.streamlit.app/
    https://kogas-import-supply-analytics.streamlit.app/
    https://korea-city-gas-coverage-dashboard.streamlit.app/
    https://korea-citygas-efficiency-dashboard.streamlit.app/
    https://news4daesungclient.streamlit.app/
    https://daesung-sales-report-app.streamlit.app/
    https://daegu-teamdinner-map.streamlit.app/
    https://daegu-map-visualization.streamlit.app/
    https://daily-supply-analysis-9u5v84eej7qyp4hk6fty88.streamlit.app/
    https://daesung-marketing-dashboard.streamlit.app/
    https://dse-sales-bigquery.streamlit.app/
    https://daesung-energy-price-checker.streamlit.app/
    https://epost-query-automation.streamlit.app/
    https://firstwebsite-jttokbjy6infprpezc9unv.streamlit.app/
    https://dxwkeq68qofqttoypqy9cz.streamlit.app/
    https://hvac-history-manager.streamlit.app/
    https://daesung-industrial-client-aid.streamlit.app/
    https://industrial-gas-price-predictor.streamlit.app/
    https://daesung-industry-sale-yearly-top-n.streamlit.app/
    https://korea-city-gas-unit-price.streamlit.app/
    https://lng-lpg-forecast-dse.streamlit.app/
    https://monthly-appuct-supply-forecast-gml8ybxyfq88k8co8sdwxy.streamlit.app/
    https://news4daesung.streamlit.app/
    https://road-dig-review.streamlit.app/
    https://daesung-marketing-sale-analysis.streamlit.app/
    https://segment-economic-review.streamlit.app/
    https://daesung-temp-supply-forecast.streamlit.app/
    https://daesung-temp-supply-webapp.streamlit.app/
    https://testtest-e6pdvtmcyfdmdkyxcvpuzi.streamlit.app/

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open every app (wake up if asleep)
        run: |
          python - <<'PY'
          import asyncio, os, sys
          from playwright.async_api import async_playwright

          urls = [u.strip() for u in os.environ["APPS"].splitlines()
                  if u.strip() and not u.strip().startswith("#")]
          sem = asyncio.Semaphore(int(os.environ.get("CONCURRENCY", "6")))
          results = {}

          async def visit(browser, url):
              async with sem:
                  page = await browser.new_page()
                  try:
                      await page.goto(url, wait_until="domcontentloaded", timeout=120_000)
                      await page.wait_for_timeout(10_000)
                      btn = page.get_by_role("button", name="Yes, get this app back up!")
                      if await btn.count():
                          await btn.click()
                          await page.wait_for_timeout(90_000)   # 다시 켜질 때까지 대기
                          results[url] = "깨움"
                      else:
                          await page.wait_for_timeout(20_000)   # 앱이 실제로 실행되도록 잠시 머묾
                          results[url] = "정상"
                  except Exception as e:
                      results[url] = f"실패 ({type(e).__name__})"
                  finally:
                      await page.close()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  await asyncio.gather(*(visit(browser, u) for u in urls))
                  await browser.close()

          asyncio.run(main())
          for u in urls:
              print(f"[{results.get(u, '?')}] {u}")
          failed = [u for u, r in results.items() if r.startswith("실패")]
          print(f"\n총 {len(urls)}개 · 깨움 {sum(r == '깨움' for r in results.values())}개 · 실패 {len(failed)}개")
          if failed:
              sys.exit(1)   # 하나라도 실패하면 Actions에 빨간불 → 메일 알림
          PY

      # GitHub는 60일 동안 저장소에 활동(커밋)이 없으면 예약 실행(schedule)을 자동으로 꺼버림
      # → 마지막 커밋이 50일 넘었으면 기록 파일 하나를 커밋해서 계속 켜져 있게 함
      - name: Keep repository active
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > last_keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_keepalive.txt
            git commit -m "keepalive: 저장소 활동 유지"
            git push
          fi
